# Render.com Blueprint — deploy the whole stack with one click.
# https://render.com  (free tier)
#
# What it creates:
#   1. distohelp-ps03-api   — FastAPI backend (HAPI sandbox for FHIR storage)
#   2. distohelp-ps03-ui    — Static frontend (Vite build, CDN, HTTPS)
#
# Usage: render.com -> New -> Blueprint -> pick this repo -> Apply
# The .onrender.com URL appears after the first deploy (~3-5 min).

services:
  - type: web
    name: distohelp-ps03-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: HAPI_FHIR_URL
        value: https://hapi.fhir.org/baseR4
      - key: DEMO_AUTOSTREAM
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    runtime: static
    name: distohelp-ps03-ui
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://distohelp-ps03-api.onrender.com
      - key: VITE_WS_URL
        value: https://distohelp-ps03-api.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
