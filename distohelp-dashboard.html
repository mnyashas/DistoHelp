        // ===== UTILITY FUNCTIONS =====
        const generateHistory = (base, variance, trend = 0) => {
            const data = [];
            for (let i = 6; i >= 0; i--) {
                const dayVar = (Math.random() - 0.5) * variance;
                const trendEffect = trend * (6 - i) * 0.1;
                data.push(Math.round((base + dayVar + trendEffect) * 10) / 10);
            }
            return data;
        };

            const t = {
                respiratoryRate: {normal:[12,20],warning:[10,24],critical:[8,28]},
                heartRate: {normal:[60,100],warning:[50,110],critical:[40,130]},
                spo2: {normal:[95,100],warning:[90,94],critical:[0,89]},
                temperature: {normal:[36.1,37.2],warning:[35.5,38.0],critical:[35.0,39.0]},
                systolicBP: {normal:[90,120],warning:[121,139],critical:[140,200]},
                diastolicBP: {normal:[60,80],warning:[81,89],critical:[90,120]},
                bmi: {normal:[18.5,24.9],warning:[25,29.9],critical:[30,50]}
            }[key];
            if (!t) return 'normal';
            if (value >= t.normal[0] && value <= t.normal[1]) return 'normal';
            if (value >= t.warning[0] && value <= t.warning[1]) return 'warning';
            return 'critical';

        // ===== CHART RENDERING (Canvas) =====
        function drawChart(canvas, data, color, label) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width = canvas.offsetWidth;
            const h = canvas.height = canvas.offsetHeight;
            const padding = {top: 10, right: 10, bottom: 25, left: 35};
            const gw = w - padding.left - padding.right;
            const gh = h - padding.top - padding.bottom;
            
            ctx.clearRect(0, 0, w, h);
            
            const minVal = Math.min(...data);
            const maxVal = Math.max(...data);
            const range = maxVal - minVal || 1;
            
            const gradient = ctx.createLinearGradient(0, padding.top, 0, padding.top + gh);
            gradient.addColorStop(0, color + '40');
            gradient.addColorStop(1, color + '00');
            
            // Grid lines
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = padding.top + (gh * i / 4);
                ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(w - padding.right, y); ctx.stroke();
            }
            
            // Y-axis labels
            ctx.fillStyle = '#94a3b8';
            ctx.font = '10px system-ui';
            ctx.textAlign = 'right';
            for (let i = 0; i <= 4; i++) {
                const val = maxVal - (range * i / 4);
                const y = padding.top + (gh * i / 4) + 3;
                ctx.fillText(val.toFixed(1), padding.left - 5, y);
            }
            
            // X-axis labels
            ctx.textAlign = 'center';
            data.forEach((_, i) => {
                const x = padding.left + (gw * i / (data.length - 1));
                ctx.fillText(labels[i], x, h - 5);
            });
            
            // Area fill
            ctx.beginPath();
            ctx.moveTo(padding.left, padding.top + gh);
            data.forEach((v, i) => {
                const x = padding.left + (gw * i / (data.length - 1));
                const y = padding.top + gh - ((v - minVal) / range * gh);
                if (i === 0) ctx.lineTo(x, y);
                else ctx.lineTo(x, y);
            });
            data.slice().reverse().forEach((v, i) => {
                const x = padding.left + (gw * (data.length - 1 - i) / (data.length - 1));
                ctx.lineTo(x, padding.top + gh);
            });
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Line
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            data.forEach((v, i) => {
                const x = padding.left + (gw * i / (data.length - 1));
                const y = padding.top + gh - ((v - minVal) / range * gh);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
            
            // Points
            data.forEach((v, i) => {
                const x = padding.left + (gw * i / (data.length - 1));
                const y = padding.top + gh - ((v - minVal) / range * gh);
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

                        h('div', {className: 'chart-container h-40'}, [h('canvas', {className: 'chart-canvas w-full h-full', 'data-chart-data': JSON.stringify(s.history.weight || []), 'data-chart-color': chartColors.weight, 'data-chart-label': 'Weight'})])
                    ]),
                    h('div', {className: 'bg-white rounded-xl border border-slate-200 shadow-sm p-6'}, [
                        h('div', {className: 'flex items-center gap-3 mb-4'}, [h('div', {className: 'w-12 h-12 rounded-xl bg-purple-100 flex items-center justify-center'}, [Icon('circle', 'w-6 h-6 text-purple-600')]), h('div', null, [h('h3', {className: 'font-semibold text-slate-900'}, 'Head Circumference'), h('p', {className: 'text-sm text-slate-500'}, 'Maximum cranial circumference')])]),
                        h('div', {className: 'flex items-center gap-4 mb-4'}, [h('input', {type:'number',step:0.1,min:30,max:70,value:s.vitals.headCircumference.value,onChange:e=>updateVital('headCircumference',parseFloat(e.target.value)),className:'flex-1 px-4 py-3 border border-slate-200 rounded-lg text-2xl font-mono text-center focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent'}), h('span', {className: 'text-slate-500 font-medium text-lg'}, 'cm')]),
                        h('div', {className: 'text-sm text-slate-500'}, 'Reference: Adult average 55-58 cm')
                    ])
                ]),
                h('div', {className: 'bg-white rounded-xl border border-slate-200 shadow-sm p-6'}, [
                    h('div', {className: 'flex items-center justify-between mb-4'}, [
                        h('div', {className: 'flex items-center gap-3'}, [h('div', {className: 'w-10 h-10 rounded-lg bg-violet-100 flex items-center justify-center'}, [Icon('chart-line', 'w-5 h-5 text-violet-600')]), h('div', null, [h('h3', {className: 'font-semibold text-slate-900'}, 'BMI Trend (7 Days)'), h('p', {className: 'text-sm text-slate-500'}, 'Body Mass Index progression')])]),
                        h('div', {className: `px-3 py-1 rounded-full text-sm font-medium ${bmiCategory.bg} ${bmiCategory.color}`}, bmiCategory.label)
                    ]),
                    h('div', {className: 'chart-container h-64'}, [h('canvas', {className: 'chart-canvas w-full h-full', 'data-chart-data': JSON.stringify(s.history.bmi || []), 'data-chart-color': chartColors.bmi, 'data-chart-label': 'BMI'})]),
                    h('div', {className: 'mt-4 grid grid-cols-3 gap-4 text-center'}, [
                        h('div', {className: 'p-3 bg-slate-50 rounded-lg'}, [h('p', {className: 'text-2xl font-bold text-slate-900'}, bmiVal), h('p', {className: 'text-xs text-slate-500'}, 'Current BMI')]),
                        h('div', {className: 'p-3 bg-slate-50 rounded-lg'}, [h('p', {className: 'text-2xl font-bold text-slate-900'}, `${Math.round((bmiVal - (s.history.bmi||[bmiVal])[0]) * 10) / 10 > 0 ? '+' : ''}${Math.round((bmiVal - (s.history.bmi||[bmiVal])[0]) * 10) / 10}`), h('p', {className: 'text-xs text-slate-500'}, '7-Day Change')]),
                        h('div', {className: 'p-3 bg-slate-50 rounded-lg'}, [h('p', {className: 'text-2xl font-bold text-slate-900'}, '18.5 - 24.9'), h('p', {className: 'text-xs text-slate-500'}, 'Target Range')])
                    ])
                ])
            ]);
        }

        // ===== TAB 4: QUICK ENTRY & ALERTS =====
        function renderQuickEntryTab() {
            const s = currentState;
            const displayTemp = v => s.tempUnit === 'fahrenheit' ? Math.round((v * 9/5) + 32) : v;
            const displayTempUnit = s.tempUnit === 'fahrenheit' ? '°F' : '°C';
            const normalTempRange = s.tempUnit === 'fahrenheit' ? '97-99°F' : '36.1-37.2°C';
            const displayWeight = v => s.weightUnit === 'lbs' ? Math.round(v * 2.20462 * 10) / 10 : v;
            const displayWeightUnit = s.weightUnit === 'lbs' ? 'lbs' : 'kg';
            const displayHeight = v => s.heightUnit === 'inches' ? Math.round(v / 2.54 * 10) / 10 : v;
            const displayHeightUnit = s.heightUnit === 'inches' ? 'in' : 'cm';
            
            const params = [
                {key:'respiratoryRate',label:'Respiratory Rate',unit:'breaths/min',icon:'wind',step:1,min:0,max:50},
                {key:'heartRate',label:'Heart Rate',unit:'bpm',icon:'heart-pulse',step:1,min:30,max:200},
                {key:'spo2',label:'SpO₂',unit:'%',icon:'droplet',step:1,min:70,max:100},
                {key:'temperature',label:'Temperature',unit:displayTempUnit,icon:'thermometer',step:0.1,min:30,max:42},
                {key:'systolicBP',label:'Systolic BP',unit:'mmHg',icon:'gauge',step:1,min:60,max:250},
                {key:'diastolicBP',label:'Diastolic BP',unit:'mmHg',icon:'gauge',step:1,min:30,max:150},
                {key:'height',label:'Height',unit:displayHeightUnit,icon:'ruler',step:0.1,min:50,max:250},
                {key:'headCircumference',label:'Head Circumference',unit:'cm',icon:'circle',step:0.1,min:30,max:70},
                {key:'weight',label:'Weight',unit:displayWeightUnit,icon:'scale',step:0.1,min:20,max:300},
                {key:'bmi',label:'BMI',unit:'kg/m²',icon:'calculator',step:0.1,min:10,max:60}
            ];
            
            // Generate alerts
            const alerts = params.filter(p => p.key !== 'bmi').map(p => {
                const v = s.vitals[p.key];
                const status = getStatus(p.key, v.value);
                if (status === 'normal') return null;
                let displayVal = v.value, displayUnit = v.unit;
                if (p.key === 'temperature') { displayVal = displayTemp(v.value); displayUnit = displayTempUnit; }
                else if (p.key === 'weight') { displayVal = displayWeight(v.value); displayUnit = displayWeightUnit; }
                else if (p.key === 'height') { displayVal = displayHeight(v.value); displayUnit = displayHeightUnit; }
                return {key:p.key,label:p.label,value:displayVal,unit:displayUnit,status,normalRange:p.key==='temperature'?normalTempRange:v.normalRange};
            }).filter(Boolean);
            
            return h('div', {className: 'space-y-6 animate-fade-in'}, [
                h('div', {className: 'flex items-center justify-between'}, [
                    h('div', null, [h('h2', {className: 'text-2xl font-bold text-slate-900'}, 'Quick Entry & Deterioration Alerts'), h('p', {className: 'text-sm text-slate-500'}, 'Log all parameters in one place • Active alerts panel')]),
                    h('button', {className: 'px-4 py-2 bg-teal-600 text-white rounded-lg font-medium hover:bg-teal-700 transition-colors flex items-center gap-2', onClick: () => alert('All vitals saved successfully!')}, [Icon('save', 'w-4 h-4'), 'Save All'])
                ]),
                h('div', {className: 'grid grid-cols-1 lg:grid-cols-3 gap-6'}, [
                    h('div', {className: 'lg:col-span-2 space-y-6'}, [
                        h('div', {className: 'bg-white rounded-xl border border-slate-200 shadow-sm p-6'}, [
                            h('h3', {className: 'font-semibold text-slate-900 mb-4 flex items-center gap-2'}, [Icon('clipboard-pen', 'w-5 h-5 text-teal-600'), 'Vital Signs Entry Form']),
                            h('div', {className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4'}, params.map(param => {
                                const v = s.vitals[param.key];
                                let displayValue = v.value;
                                if (param.key === 'temperature') displayValue = displayTemp(v.value);
                                else if (param.key === 'weight') displayValue = displayWeight(v.value);
                                else if (param.key === 'height') displayValue = displayHeight(v.value);
                                const status = getStatus(param.key, v.value);
                                const isCalculated = param.key === 'bmi';
                                const borderClass = status === 'normal' ? 'border-green-200 bg-green-50' : status === 'warning' ? 'border-amber-200 bg-amber-50' : 'border-red-200 bg-red-50';
                                return h('div', {key: param.key, className: `relative p-4 rounded-lg border ${borderClass}`}, [
                                    h('div', {className: 'absolute top-2 right-2'}, [h('span', {className: `px-2 py-0.5 rounded-full text-xs font-semibold ${badgeClass(status)}`}, status.charAt(0).toUpperCase() + status.slice(1))]),
                                    h('label', {className: 'block text-xs font-medium text-slate-600 mb-1 flex items-center gap-1'}, [Icon(param.icon, 'w-3 h-3'), param.label]),
                                    h('div', {className: 'flex items-center gap-2'}, [
                                        h('input', {type:'number',step:param.step,min:param.min,max:param.max,value:displayValue,onChange:e=>handleQuickEntryChange(param.key,parseFloat(e.target.value)),disabled:isCalculated,className:`flex-1 px-3 py-2 border rounded-lg text-sm text-center focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent ${isCalculated?'bg-slate-100 cursor-not-allowed':'bg-white'}`}),
                                        h('span', {className: 'text-xs text-slate-500 font-medium w-16 text-right'}, param.unit)
                                    ]),
                                    h('p', {className: 'mt-1 text-xs text-slate-500'}, `Ref: ${param.key==='temperature'?normalTempRange:v.normalRange}`)
                                ]);
                            }))
                        ])
                    ]),
                    h('div', {className: 'space-y-6'}, [
                        h('div', {className: 'bg-white rounded-xl border border-slate-200 shadow-sm p-6 h-full'}, [
                            h('div', {className: 'flex items-center justify-between mb-4'}, [
                                h('h3', {className: 'font-semibold text-slate-900 flex items-center gap-2'}, [Icon('alert-triangle', 'w-5 h-5 text-amber-600'), 'Active Alerts']),
                                h('span', {className: `px-2 py-1 rounded-full text-xs font-semibold ${alerts.length>0?'badge-critical':'badge-normal'}`}, alerts.length>0?`${alerts.length} Active`:'All Clear')
                            ]),
                            alerts.length === 0 ? h('div', {className: 'text-center py-8'}, [h('div', {className: 'w-16 h-16 mx-auto mb-4 rounded-full bg-green-100 flex items-center justify-center'}, [Icon('check-circle-2', 'w-8 h-8 text-green-600')]), h('p', {className: 'text-slate-600 mb-1'}, 'No Active Alerts'), h('p', {className: 'text-sm text-slate-500'}, 'All parameters within normal ranges')]) :
                            h('div', {className: 'space-y-3 max-h-96 overflow-y-auto'}, alerts.map(alert =>
                                h('div', {key: alert.key, className: `p-4 rounded-lg border-l-4 ${alert.status==='warning'?'border-amber-500 bg-amber-50':'border-red-500 bg-red-50'}`}, [
                                    h('div', {className: 'flex items-start justify-between gap-2'}, [
                                        h('div', {className: 'flex-1'}, [
                                            h('p', {className: 'font-medium text-slate-900 flex items-center gap-1'}, [Icon(alert.status==='critical'?'alert-circle':'alert-triangle', `w-4 h-4 ${alert.status==='critical'?'text-red-500':'text-amber-500'}`), alert.label]),
                                            h('p', {className: 'text-sm text-slate-600 mt-1'}, `Current: ${alert.value}${alert.unit} • Normal: ${alert.normalRange}`)
                                        ])
                                    ]),
                                    h('div', {className: 'mt-2 flex items-center gap-2'}, [
                                        h('span', {className: `px-2 py-1 rounded-full text-xs font-semibold ${alert.status==='warning'?'badge-warning':'badge-critical'}`}, alert.status.charAt(0).toUpperCase() + alert.status.slice(1)),
                                        h('span', {className: 'text-xs text-slate-500'}, 'Requires attention')
                                    ])
                                ])
                            ))
                        ]),
                        h('div', {className: 'bg-white rounded-xl border border-slate-200 shadow-sm p-6'}, [
                            h('h3', {className: 'font-semibold text-slate-900 mb-4 flex items-center gap-2'}, [Icon('zap', 'w-5 h-5 text-teal-600'), 'Quick Actions']),
                            h('div', {className: 'space-y-2'}, [
                                ['phone','Contact Care Team','Escalate to healthcare provider','teal'],
                                ['message-square','Send Secure Message','Message your care coordinator','blue'],
                                ['calendar','Schedule Follow-up','Book appointment with physician','amber'],
                                ['download','Export Report','Download PDF summary for visit','green']
                            ].map(([icon,title,desc,color]) => h('button', {className: 'w-full px-4 py-3 text-left border border-slate-200 rounded-lg hover:bg-slate-50 hover:border-teal-300 transition-colors flex items-center gap-3'}, [
                                h('div', {className: `w-10 h-10 rounded-lg bg-${color}-100 flex items-center justify-center`}, [Icon(icon, `w-5 h-5 text-${color}-600`)]),
                                h('div', null, [h('p', {className: 'font-medium text-slate-900'}, title), h('p', {className: 'text-sm text-slate-500'}, desc)])
                            ]))
                        ])
                    ])
                ])
            ]);
        }

        // ===== VITAL UPDATE HANDLERS =====
        function updateVital(key, value) {
            const s = currentState;
            const newVitals = {...s.vitals, [key]: {...s.vitals[key], value}};
            const newHistory = {...s.history};
            const newData = [...(newHistory[key] || [])];
            newData.shift(); newData.push(value);
            newHistory[key] = newData;
            
            // Auto-calculate BMI
            if (key === 'height' || key === 'weight') {
                const h = key === 'height' ? value : s.vitals.height.value;
                const w = key === 'weight' ? value : s.vitals.weight.value;
                const newBMI = Math.round((w / ((h/100)*(h/100))) * 10) / 10;
                newVitals.bmi = {...s.vitals.bmi, value: newBMI};
                const bmiData = [...newHistory.bmi]; bmiData.shift(); bmiData.push(newBMI); newHistory.bmi = bmiData;
            }
            
            setState({vitals: newVitals, history: newHistory, quickEntryData: {...s.quickEntryData, [key]: {...s.quickEntryData[key], value}}});
        }

        function handleQuickEntryChange(key, value) {
            const s = currentState;
            let val = value;
            if (key === 'temperature' && s.tempUnit === 'fahrenheit') val = (value - 32) * 5/9;
            else if (key === 'weight' && s.weightUnit === 'lbs') val = value / 2.20462;
            else if (key === 'height' && s.heightUnit === 'inches') val = value * 2.54;
            updateVital(key, val);
        }

        // ===== INITIALIZE =====
        render();
    </script>
